spring.application.name=Entry-point

server.port=9999

spring.cloud.gateway.server.webflux.routes[0].id=feign
spring.cloud.gateway.server.webflux.routes[0].uri=lb://OPEN-FEIGN
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/feign/**

spring.cloud.gateway.server.webflux.routes[1].id=clients
spring.cloud.gateway.server.webflux.routes[1].uri=lb://CONFIG-CLIENT
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/client/**

spring.cloud.gateway.server.webflux.routes[2].id=rest
spring.cloud.gateway.server.webflux.routes[2].uri=lb://REST-TEMPLATE-DEMO
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/rest/**

spring.cloud.gateway.server.webflux.routes[3].id=web
spring.cloud.gateway.server.webflux.routes[3].uri=http://localhost:2356
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/web/**